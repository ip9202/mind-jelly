<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .jelly-float {
            animation: floating 3s ease-in-out infinite;
        }
        @keyframes floating {
            0% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-20px) scale(1.05); }
            100% { transform: translateY(0px) scale(1); }
        }
        .bg-gradient-splash {
            background: linear-gradient(135deg, #E6E6FA 0%, #FFD1DC 50%, #FFE5D9 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
        }
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .soft-glass {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background font-body-md text-on-surface antialiased overflow-hidden">
<!-- Splash Screen Container -->
<main class="relative w-full h-screen flex flex-col items-center justify-between py-16 px-layout-margin bg-gradient-splash">
<!-- Decorative Floating Elements -->
<div class="absolute inset-0 pointer-events-none overflow-hidden">
<span class="material-symbols-outlined absolute text-primary/30 text-[32px] top-[15%] left-[10%] opacity-60">favorite</span>
<span class="material-symbols-outlined absolute text-secondary/30 text-[24px] top-[25%] right-[15%] opacity-50">star</span>
<span class="material-symbols-outlined absolute text-primary/40 text-[20px] bottom-[30%] left-[20%] opacity-40">favorite</span>
<span class="material-symbols-outlined absolute text-tertiary/30 text-[28px] top-[60%] right-[10%] opacity-60">pets</span>
<span class="material-symbols-outlined absolute text-primary/20 text-[40px] bottom-[10%] right-[25%] opacity-30">bubble_chart</span>
</div>
<!-- Top Spacing -->
<div class="h-12"></div>
<!-- Hero Section: The Jelly -->
<div class="flex flex-col items-center justify-center w-full flex-grow space-y-8">
<!-- Jelly Character Container -->
<div class="relative w-64 h-64 flex items-center justify-center jelly-float">
<!-- Soft Glow Behind Jelly -->
<div class="absolute inset-0 bg-jelly-base blur-[60px] opacity-40 rounded-full"></div>
<!-- Jelly Illustration Replacement (Using a Styled Container for the Vibe) -->
<div class="relative w-56 h-48 bg-jelly-base rounded-[45%_45%_35%_35%] shadow-[inset_-10px_-10px_30px_rgba(255,255,255,0.6),inset_10px_10px_30px_rgba(120,85,94,0.15)] flex flex-col items-center justify-center overflow-hidden border-b-8 border-primary/10">
<!-- Jelly Eyes -->
<div class="flex space-x-12 mb-2">
<div class="w-4 h-4 bg-primary rounded-full"></div>
<div class="w-4 h-4 bg-primary rounded-full"></div>
</div>
<!-- Jelly Blush -->
<div class="absolute flex justify-between w-40 px-4">
<div class="w-6 h-3 bg-red-300/40 rounded-full blur-sm"></div>
<div class="w-6 h-3 bg-red-300/40 rounded-full blur-sm"></div>
</div>
<!-- Jelly Smile -->
<div class="w-6 h-3 border-b-4 border-primary rounded-full"></div>
</div>
</div>
<!-- Branding -->
<div class="text-center space-y-2 z-10">
<h1 class="font-dongle text-display text-primary tracking-tight leading-none">마인드 젤리</h1>
<p class="font-gamja text-tagline text-on-surface-variant opacity-80">오늘 하루, 젤리에게 맡겨요</p>
</div>
</div>
<!-- Bottom Action -->
<div class="w-full max-w-sm px-6 pb-4">
<button class="w-full py-5 rounded-lg bg-gradient-to-r from-primary-container to-primary/20 text-on-primary-container font-h1 shadow-lg shadow-primary/10 hover:shadow-xl transition-all duration-300 active:scale-95 flex items-center justify-center space-x-3 group">
<span class="font-h1 text-h1">시작하기</span>
<span class="material-symbols-outlined group-hover:translate-x-1 transition-transform">arrow_forward_ios</span>
</button>
<p class="mt-6 text-center font-caption text-on-surface-variant/60">
                로그인 없이 바로 시작할 수 있어요
            </p>
</div>
</main>
<!-- Content Cards (Decorative/Background context if visible) -->
<div class="fixed top-0 left-0 w-full h-full -z-10 pointer-events-none opacity-20">
