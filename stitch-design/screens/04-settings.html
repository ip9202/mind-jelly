<!DOCTYPE html>

<html lang="ko"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700&amp;family=Gowun+Dodum&amp;family=Dongle:wght@300;400;700&amp;family=Gamja+Flower&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .font-dongle { font-family: 'Dongle', sans-serif; }
        .font-gowun { font-family: 'Gowun Dodum', sans-serif; }
        .ease-spring { transition-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1); }
        .jelly-float { animation: float 6s ease-in-out infinite; }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
    
        .font-gamja { font-family: 'Gamja Flower', cursive; }</style>

                      "surface-container": "#efeeeb",
                      "outline": "#817476",
                      "surface": "#fbf9f6",
                      "primary-fixed": "#ffd9e2",
                      "surface-container-lowest": "#ffffff",
                      "surface-container-high": "#eae8e5",
                      "background": "#fbf9f6",
                      "on-surface": "#1b1c1a",
                      "primary": "#78555e",
                      "on-primary": "#ffffff",
                      "inverse-surface": "#30312f",
                      "tertiary-fixed-dim": "#c5c5d8",

                      "space-sm": "8px"

              "fontFamily": {
                      "h1": ["Plus Jakarta Sans"],

                      "body-md": ["16px", {"lineHeight": "1.5", "fontWeight": "500"}],

            },
          },
        }

<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-surface font-body-md min-h-screen pb-32 overflow-x-hidden">
<!-- Top AppBar -->
<header class="bg-surface/85 dark:bg-surface-dim/85 backdrop-blur-[8px] docked full-width top-0 z-40 fixed">
<div class="flex justify-between items-center w-full px-layout-margin h-16">
<button class="text-primary hover:opacity-80 transition-opacity flex items-center">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="text-h1 text-primary tracking-tight font-dongle text-5xl">설정</h1>
<div class="w-8"></div> <!-- Spacer for centering -->
</div>
</header>
<main class="mt-20 px-layout-margin space-y-gutter">
<!-- Jelly Appearance Section -->
<section class="space-y-space-sm">
<h2 class="font-dongle text-4xl text-primary leading-none px-2 text-5xl">색상 테마</h2>
<div class="glass-card rounded-lg p-space-lg shadow-[0_4px_20px_0_rgba(0,0,0,0.05)] border border-white/40">
<div class="flex items-center gap-space-lg">
<div class="relative w-24 h-24 flex items-center justify-center">
<div class="w-20 h-20 bg-jelly-base rounded-full blur-[2px] jelly-float shadow-[inset_-4px_-8px_15px_rgba(255,255,255,0.6),0_8px_15px_rgba(0,0,0,0.05)] relative overflow-hidden">
<div class="absolute top-1/3 left-1/4 w-2 h-1.5 bg-on-primary-container rounded-full opacity-60"></div>
<div class="absolute top-1/3 right-1/4 w-2 h-1.5 bg-on-primary-container rounded-full opacity-60"></div>
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 w-4 h-1.5 bg-on-primary-container/40 rounded-full"></div>
</div>
</div>
<div class="grid grid-cols-3 gap-space-md flex-1">
<button class="w-10 h-10 rounded-full bg-jelly-base ring-4 ring-primary-container border-2 border-white shadow-sm"></button>
<button class="w-10 h-10 rounded-full bg-jelly-tired border-2 border-white shadow-sm hover:scale-105 transition-transform"></button>
<button class="w-10 h-10 rounded-full bg-secondary-container border-2 border-white shadow-sm hover:scale-105 transition-transform"></button>
<button class="w-10 h-10 rounded-full bg-jelly-sad border-2 border-white shadow-sm hover:scale-105 transition-transform"></button>
<button class="w-10 h-10 rounded-full bg-tertiary-fixed border-2 border-white shadow-sm hover:scale-105 transition-transform"></button>
<button class="w-10 h-10 rounded-full bg-jelly-anger border-2 border-white shadow-sm hover:scale-105 transition-transform"></button>
</div>
</div>
<p class="text-caption text-on-surface-variant mt-space-md text-center font-gamja text-lg">젤리의 기분에 맞춰 색상을 변경해보세요</p>
</div>
</section>
<!-- Sound Settings Section -->
<section class="space-y-space-sm">
<h2 class="font-dongle text-4xl text-primary leading-none px-2 text-5xl">소리 설정</h2>
<div class="glass-card rounded-lg p-space-lg shadow-[0_4px_20px_0_rgba(0,0,0,0.05)] border border-white/40 space-y-space-lg">
<div class="flex justify-between items-center">
<span class="font-gowun text-body-md text-on-surface">배경 음악</span>
<button class="w-12 h-6 bg-primary-container rounded-full relative transition-colors">
<div class="absolute right-1 top-1 w-4 h-4 bg-white rounded-full shadow-sm"></div>
</button>
</div>
<div class="space-y-space-xs">
<div class="flex justify-between items-center text-caption font-gowun text-on-surface-variant">
<span>볼륨</span>
<span>70%</span>
</div>
<div class="h-2 w-full bg-primary-container/30 rounded-full relative">
<div class="h-full w-[70%] bg-primary rounded-full relative">
<div class="absolute -right-2 -top-1.5 w-5 h-5 bg-white border-4 border-primary rounded-full shadow-md"></div>
</div>
</div>
</div>
<div class="flex justify-between items-center">
<span class="font-gowun text-body-md text-on-surface">효과음</span>
<button class="w-12 h-6 bg-primary-container rounded-full relative transition-colors">
<div class="absolute right-1 top-1 w-4 h-4 bg-white rounded-full shadow-sm"></div>
</button>
</div>
</div>
</section>
<!-- Notifications Section -->
<section class="space-y-space-sm">
<h2 class="font-dongle text-4xl text-primary leading-none px-2 text-5xl">알림</h2>
<div class="glass-card rounded-lg shadow-[0_4px_20px_0_rgba(0,0,0,0.05)] border border-white/40 overflow-hidden">
<div class="p-space-md border-b border-white/40 flex justify-between items-center hover:bg-white/40 transition-colors cursor-pointer">
<span class="font-gowun text-body-md text-on-surface">데일리 리마인더</span>
<span class="material-symbols-outlined text-on-surface-variant">chevron_right</span>
</div>
<div class="p-space-md border-b border-white/40 flex justify-between items-center hover:bg-white/40 transition-colors cursor-pointer">
<span class="font-gowun text-body-md text-on-surface">스트레스 분석 알림</span>
<span class="material-symbols-outlined text-on-surface-variant">chevron_right</span>
</div>
<div class="p-space-md flex justify-between items-center hover:bg-white/40 transition-colors cursor-pointer">
<span class="font-gowun text-body-md text-on-surface">방해 금지 모드</span>
<span class="material-symbols-outlined text-on-surface-variant">chevron_right</span>
</div>
</div>
</section>
<!-- About Section -->
<section class="space-y-space-sm">
<h2 class="font-dongle text-4xl text-primary leading-none px-2 text-5xl">정보</h2>
<div class="glass-card rounded-lg shadow-[0_4px_20px_0_rgba(0,0,0,0.05)] border border-white/40 overflow-hidden">
<div class="p-space-md border-b border-white/40 flex justify-between items-center">
<span class="font-gowun text-body-md text-on-surface">버전 정보</span>
<span class="text-on-surface-variant font-gowun">v1.2.4</span>
</div>
<div class="p-space-md border-b border-white/40 flex justify-between items-center hover:bg-white/40 transition-colors cursor-pointer">
<span class="font-gowun text-body-md text-on-surface">도움말</span>
<span class="material-symbols-outlined text-on-surface-variant">open_in_new</span>
</div>
<div class="p-space-md flex justify-between items-center hover:bg-white/40 transition-colors cursor-pointer text-error">
<span class="font-gowun text-body-md">데이터 초기화</span>
<span class="material-symbols-outlined">delete_forever</span>
</div>
</div>
</section>
<!-- Decorative Element -->
<div class="pt-space-xl flex flex-col items-center opacity-40">
<img alt="bubbles" class="w-8 h-8 mb-2" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC_9FH5hhzt-V-vWWbCP3VCGxZrVzacCC4afhsakyU1N6hSJk665KsRT765pmUBJtr5lurvfkJwfL_F_vSsVrH8mlx5LhgRKxt1DDNATGO3X_U-OkJDu1wwZsKfsqKvwlQRW9jf2Kjga3uPNe3S3AWb-SojosRmmVOEGrpTKVw7lGGi2oWKv0eTB9sfWEpwGk4ETGd-19FjJFt8Om_QD7-FUUgouGOU0rMSwIQh1AjKoK78K-QTk8AZUrZyL2AaYLnda65WX9ZibjM"/>
<p class="font-dongle text-2xl text-primary">Mind Jelly with Love</p>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-space-md pb-space-lg pt-space-sm bg-surface/85 backdrop-blur-[8px] shadow-[0_-4px_20px_0_rgba(0,0,0,0.05)] rounded-t-lg">
<button class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:bg-primary-container/40 rounded-full transition-all">
<span class="material-symbols-outlined" data-icon="mood">mood</span>
<span class="font-caption text-caption">Jelly</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:bg-primary-container/40 rounded-full transition-all">
<span class="material-symbols-outlined" data-icon="history">history</span>
<span class="font-caption text-caption">History</span>
</button>
<button class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-6 py-1.5 transition-all duration-500 ease-spring scale-90">
<span class="material-symbols-outlined" data-icon="park">park</span>
<span class="font-caption text-caption">Garden</span>
</button>
</nav>
<!-- Background Illustration -->
<div class="fixed top-0 left-0 w-full h-full -z-10 pointer-events-none opacity-20">
<div class="absolute top-[10%] right-[5%] w-64 h-64 bg-primary-container rounded-full blur-[80px]"></div>
<div class="absolute bottom-[20%] left-[5%] w-48 h-48 bg-secondary-container rounded-full blur-[60px]"></div>
</div>
</body></html>
