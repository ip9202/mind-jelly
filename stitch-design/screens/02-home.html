<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&amp;family=Gamja+Flower&amp;family=Dongle:wght@300;400;700&amp;family=Gowun+Dodum&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
                  "on-tertiary-fixed-variant": "#444655",
                  "jelly-anger": "#FFB3A7",
                  "on-primary": "#ffffff",
                  "surface-container-lowest": "#ffffff",
                  "surface-container-highest": "#e4e2df",
                  "secondary": "#4b626a",
                  "on-surface": "#1b1c1a",
                  "on-tertiary-fixed": "#191b29",
                  "surface-bright": "#fbf9f6",
                  "surface-tint": "#78555e",
                  "tertiary-container": "#dbdbef",
                  "jelly-sad": "#AEC6CF",
                  "inverse-surface": "#30312f",
                  "on-tertiary": "#ffffff",
                  "surface-container": "#efeeeb",
                  "on-secondary-fixed": "#061e25",
                  "tertiary": "#5c5d6e",
                  "bg-dark": "#191F28",
                  "on-error": "#ffffff",
                  "text-primary": "#4E5968",
                  "secondary-fixed-dim": "#b2cad3",
                  "error-container": "#ffdad6",
                  "error": "#ba1a1a",
                  "secondary-fixed": "#cee7f0",
                  "inverse-on-surface": "#f2f0ed",
                  "primary-fixed-dim": "#e7bbc6",
                  "primary-container": "#ffd1dc",
                  "jelly-tired": "#E6E6FA",
                  "outline-variant": "#d3c3c5",
                  "on-tertiary-container": "#5e6070",
                  "on-surface-variant": "#4f4446",
                  "tertiary-fixed": "#e1e1f5",
                  "background": "#fbf9f6",
                  "primary-fixed": "#ffd9e2",
                  "on-secondary": "#ffffff",
                  "on-primary-fixed": "#2d141c",
                  "secondary-container": "#cee7f0",
                  "on-error-container": "#93000a",
                  "surface": "#fbf9f6",
                  "surface-container-low": "#f5f3f0",
                  "surface-dim": "#dbdad7",
                  "tertiary-fixed-dim": "#c5c5d8",
                  "on-background": "#1b1c1a",
                  "bg-base": "#FAF8F5",
                  "on-secondary-container": "#516870",
                  "on-primary-container": "#7a5761",
                  "surface-variant": "#e4e2df",
                  "primary": "#78555e",
                  "surface-container-high": "#eae8e5",
                  "outline": "#817476",
                  "on-primary-fixed-variant": "#5e3e47",
                  "jelly-base": "#FFD1DC",
                  "on-secondary-fixed-variant": "#344a52",
                  "inverse-primary": "#e7bbc6"
          },
          "borderRadius": {
                  "DEFAULT": "1rem",
                  "lg": "2rem",
                  "xl": "3rem",
                  "full": "9999px"
          },
          "spacing": {
                  "gutter": "12px",
                  "space-md": "16px",
                  "space-xs": "4px",
                  "space-lg": "24px",
                  "space-sm": "8px",
                  "space-xl": "32px",
                  "layout-margin": "20px"
          },
          "fontFamily": {
                  "caption": ["Plus Jakarta Sans"],
                  "h1": ["Plus Jakarta Sans"],
                  "body-md": ["Plus Jakarta Sans"],
                  "dongle": ["Dongle"],
                  "dodum": ["Gowun Dodum"],
                  "flower": ["Gamja Flower"]
          },
          "fontSize": {
                  "caption": ["13px", {"lineHeight": "1.6", "fontWeight": "400"}],
                  "h1": ["24px", {"lineHeight": "1.4", "fontWeight": "700"}],
                  "body-md": ["16px", {"lineHeight": "1.5", "fontWeight": "500"}]
          }
        },
      },
    }
  </script>
<style>
    .glass-morphism {
      backdrop-filter: blur(8px);
      background-color: rgba(255, 255, 255, 0.15);
    }
    .jelly-shadow {
      box-shadow: inset -8px -8px 20px rgba(0,0,0,0.05), inset 8px 8px 20px rgba(255,255,255,0.6);
    }
    .soft-float {
      animation: float 4s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }
    .star-sparkle {
      animation: twinkle 3s ease-in-out infinite;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-gradient-to-br from-[#E6E6FA] via-[#fbf9f6] to-[#ffd9e2] min-h-screen font-dodum text-on-surface overflow-hidden">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-layout-margin h-16 backdrop-blur-md bg-white/10 dark:bg-black/10">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-3xl" data-weight="fill">bubble_chart</span>
<h1 class="font-dongle text-4xl leading-none text-primary dark:text-primary-fixed-dim tracking-tight">Mind Jelly</h1>
</div>
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:opacity-80 transition-opacity active:scale-95 duration-200">
<span class="material-symbols-outlined text-primary text-2xl">settings</span>
</button>
</header>
<!-- Main Canvas Area -->
<main class="relative w-full h-screen flex items-center justify-center overflow-hidden pt-16 pb-32">
<!-- Decorative Atmosphere -->
<div class="absolute inset-0 pointer-events-none">
<!-- Clouds -->
<div class="absolute top-[15%] left-[10%] opacity-40">
<span class="material-symbols-outlined text-6xl text-white">cloud</span>
</div>
<div class="absolute top-[25%] right-[15%] opacity-30">
<span class="material-symbols-outlined text-5xl text-white">cloud</span>
</div>
<!-- Twinkles -->
<div class="absolute top-[20%] left-[40%] star-sparkle">
<span class="material-symbols-outlined text-white text-sm">auto_awesome</span>
</div>
<div class="absolute bottom-[40%] left-[20%] star-sparkle" style="animation-delay: 1s;">
<span class="material-symbols-outlined text-white text-md">auto_awesome</span>
</div>
<div class="absolute top-[50%] right-[30%] star-sparkle" style="animation-delay: 2s;">
<span class="material-symbols-outlined text-white text-xs">auto_awesome</span>
</div>
</div>
<!-- Emotion Beads Canvas -->
<div class="absolute inset-0 pointer-events-none">
<!-- Bead: Joy -->
<div class="absolute top-[30%] left-[25%] w-6 h-6 rounded-full bg-yellow-200 border-2 border-yellow-300 shadow-sm flex items-center justify-center animate-pulse pointer-events-auto cursor-pointer hover:scale-110 transition-transform">
<div class="flex gap-0.5"><div class="w-1 h-1 bg-on-surface-variant rounded-full"></div><div class="w-1 h-1 bg-on-surface-variant rounded-full"></div></div>
</div>
<!-- Bead: Sadness -->
<div class="absolute top-[45%] right-[20%] w-4 h-4 rounded-full bg-jelly-sad border-2 border-blue-200 shadow-sm flex items-center justify-center pointer-events-auto cursor-pointer hover:scale-110 transition-transform">
<div class="w-1 h-0.5 bg-on-surface-variant rounded-full"></div>
</div>
<!-- Bead: Anger -->
<div class="absolute bottom-[45%] left-[30%] w-5 h-5 rounded-full bg-jelly-anger border-2 border-red-200 shadow-sm flex items-center justify-center pointer-events-auto cursor-pointer hover:scale-110 transition-transform">
<div class="flex gap-0.5"><div class="w-1 h-1 bg-white rounded-full"></div><div class="w-1 h-1 bg-white rounded-full"></div></div>
</div>
<!-- Bead: Disgust -->
<div class="absolute top-[20%] right-[40%] w-4 h-4 rounded-full bg-green-200 border-2 border-green-300 shadow-sm flex items-center justify-center pointer-events-auto cursor-pointer hover:scale-110 transition-transform">
<div class="w-1.5 h-1.5 border-t border-on-surface-variant rounded-full"></div>
</div>
</div>
<!-- The Jelly Character -->
<div class="relative w-64 h-64 soft-float">
<!-- Glow -->
<div class="absolute inset-0 bg-primary-container/30 blur-3xl rounded-full scale-125"></div>
<!-- Body -->
<div class="relative w-full h-full bg-jelly-base rounded-full jelly-shadow border-4 border-white/40 flex items-center justify-center">
<!-- Face: Idle Expression -->
<div class="flex flex-col items-center gap-2 mt-4">
<div class="flex gap-8">
<div class="w-2.5 h-2.5 bg-on-primary-container rounded-full"></div>
<div class="w-2.5 h-2.5 bg-on-primary-container rounded-full"></div>
</div>
<div class="w-4 h-4 rounded-full border-2 border-on-primary-container/60 bg-transparent"></div>
</div>
<!-- Inner Shine -->
<div class="absolute top-8 left-12 w-12 h-6 bg-white/40 rounded-full blur-md rotate-[-30deg]"></div>
</div>
</div>
</main>
<!-- Bottom Sheet (Collapsed) -->
<section class="fixed bottom-24 left-1/2 -translate-x-1/2 w-[calc(100%-40px)] max-w-md z-40">
<div class="bg-white/90 backdrop-blur-xl rounded-t-[28px] rounded-b-lg shadow-xl p-6">
<div class="w-12 h-1.5 bg-surface-container-high rounded-full mx-auto mb-6"></div>
<div class="flex justify-between items-end gap-2">
<!-- Joy -->
<button class="flex flex-col items-center gap-1 group active:scale-95 transition-all">
<div class="w-12 h-12 rounded-full bg-yellow-100 flex items-center justify-center group-hover:bg-yellow-200 transition-colors border-2 border-transparent group-hover:border-yellow-300">
<span class="material-symbols-outlined text-yellow-600 font-flower" data-weight="fill">sentiment_very_satisfied</span>
</div>
<span class="font-flower text-lg text-text-primary">Joy</span>
</button>
<!-- Sadness -->
<button class="flex flex-col items-center gap-1 group active:scale-95 transition-all">
<div class="w-12 h-12 rounded-full bg-blue-50 flex items-center justify-center group-hover:bg-blue-100 transition-colors border-2 border-transparent group-hover:border-blue-200">
<span class="material-symbols-outlined text-blue-400 font-flower" data-weight="fill">sentiment_sad</span>
</div>
<span class="font-flower text-lg text-text-primary">Sadness</span>
</button>
<!-- Anger -->
<button class="flex flex-col items-center gap-1 group active:scale-95 transition-all">
<div class="w-12 h-12 rounded-full bg-red-50 flex items-center justify-center group-hover:bg-red-100 transition-colors border-2 border-transparent group-hover:border-red-200">
<span class="material-symbols-outlined text-red-400 font-flower" data-weight="fill">sentiment_extremely_dissatisfied</span>
</div>
<span class="font-flower text-lg text-text-primary">Anger</span>
</button>
<!-- Fear -->
<button class="flex flex-col items-center gap-1 group active:scale-95 transition-all">
<div class="w-12 h-12 rounded-full bg-purple-50 flex items-center justify-center group-hover:bg-purple-100 transition-colors border-2 border-transparent group-hover:border-purple-200">
<span class="material-symbols-outlined text-purple-400 font-flower" data-weight="fill">psychology_alt</span>
</div>
<span class="font-flower text-lg text-text-primary">Fear</span>
</button>
<!-- Disgust -->
<button class="flex flex-col items-center gap-1 group active:scale-95 transition-all">
<div class="w-12 h-12 rounded-full bg-green-50 flex items-center justify-center group-hover:bg-green-100 transition-colors border-2 border-transparent group-hover:border-green-200">
<span class="material-symbols-outlined text-green-500 font-flower" data-weight="fill">sentiment_dissatisfied</span>
</div>
<span class="font-flower text-lg text-text-primary">Disgust</span>
</button>
</div>
</div>
</section>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-6 pt-3 bg-surface-container/80 dark:bg-bg-dark/80 backdrop-blur-lg border-t border-white/20 rounded-t-lg shadow-sm">
<!-- Jelly (Active) -->
<a class="flex flex-col items-center justify-center bg-primary-container dark:bg-on-primary-fixed-variant text-on-primary-container dark:text-primary-fixed rounded-xl px-4 py-1 active:scale-95 transition-all duration-300" href="#">
<span class="material-symbols-outlined" data-weight="fill">pets</span>
<span class="text-caption font-dodum">Jelly</span>
</a>
<!-- History -->
<a class="flex flex-col items-center justify-center text-text-primary dark:text-on-surface-variant px-4 py-1 hover:bg-surface-variant/50 active:scale-95 transition-all duration-300" href="#">
<span class="material-symbols-outlined">analytics</span>
<span class="text-caption font-dodum">History</span>
</a>
<!-- Garden -->
<a class="flex flex-col items-center justify-center text-text-primary dark:text-on-surface-variant px-4 py-1 hover:bg-surface-variant/50 active:scale-95 transition-all duration-300" href="#">
<span class="material-symbols-outlined">eco</span>
<span class="text-caption font-dodum">Garden</span>
</a>
</nav>
</body></html>
