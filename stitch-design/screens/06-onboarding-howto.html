<!DOCTYPE html>

<html lang="ko"><head><link href="https://fonts.googleapis.com/css2?family=Dongle:wght@300;400;700&amp;display=swap" rel="stylesheet"/>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&amp;family=Gowun+Dodum&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "tertiary-container": "#dbdbef",
                    "on-background": "#1b1c1a",
                    "surface-bright": "#fbf9f6",
                    "primary-fixed-dim": "#e7bbc6",
                    "outline-variant": "#d3c3c5",
                    "on-secondary-fixed-variant": "#344a52",
                    "inverse-primary": "#e7bbc6",
                    "on-secondary-container": "#516870",
                    "on-tertiary-fixed": "#191b29",
                    "on-tertiary-fixed-variant": "#444655",
                    "secondary": "#4b626a",
                    "on-primary-fixed-variant": "#5e3e47",
                    "on-tertiary-container": "#5e6070",
                    "on-primary-container": "#7a5761",
                    "secondary-fixed": "#cee7f0",
                    "text-primary": "#4E5968",
                    "on-secondary": "#ffffff",
                    "bg-dark": "#191F28",
                    "surface-container-highest": "#e4e2df",
                    "surface-container": "#efeeeb",
                    "outline": "#817476",
                    "surface": "#fbf9f6",
                    "primary-fixed": "#ffd9e2",
                    "surface-container-lowest": "#ffffff",
                    "surface-container-high": "#eae8e5",
                    "background": "#fbf9f6",
                    "on-surface": "#1b1c1a",
                    "primary": "#78555e",
                    "on-primary": "#ffffff",
                    "inverse-surface": "#30312f",
                    "tertiary-fixed-dim": "#c5c5d8",
                    "tertiary-fixed": "#e1e1f5",
                    "jelly-sad": "#AEC6CF",
                    "on-tertiary": "#ffffff",
                    "surface-tint": "#78555e",
                    "error-container": "#ffdad6",
                    "error": "#ba1a1a",
                    "jelly-anger": "#FFB3A7",
                    "secondary-container": "#cee7f0",
                    "jelly-base": "#FFD1DC",
                    "on-surface-variant": "#4f4446",
                    "surface-container-low": "#f5f3f0",
                    "surface-dim": "#dbdad7",
                    "primary-container": "#ffd1dc",
                    "tertiary": "#5c5d6e",
                    "secondary-fixed-dim": "#b2cad3",
                    "on-primary-fixed": "#2d141c",
                    "on-secondary-fixed": "#061e25",
                    "on-error": "#ffffff",
                    "inverse-on-surface": "#f2f0ed",
                    "jelly-tired": "#E6E6FA",
                    "bg-base": "#FAF8F5",
                    "surface-variant": "#e4e2df",
                    "on-error-container": "#93000a"
            },
            "borderRadius": {
                    "DEFAULT": "1rem",
                    "lg": "2rem",
                    "xl": "3rem",
                    "full": "9999px"
            },
            "spacing": {
                    "space-xs": "4px",
                    "space-lg": "24px",
                    "space-xl": "32px",
                    "layout-margin": "20px",
                    "gutter": "12px",
                    "space-md": "16px",
                    "space-sm": "8px"
            },
            "fontFamily": {
                    "h1": ["Plus Jakarta Sans"],
                    "body-md": ["Plus Jakarta Sans"],
                    "caption": ["Plus Jakarta Sans"],
                    "gowun": ["Gowun Dodum", "sans-serif"],
                    "display": ["Dongle", "sans-serif"]
            },
            "fontSize": {
                    "h1": ["24px", {"lineHeight": "1.4", "fontWeight": "700"}],
                    "body-md": ["16px", {"lineHeight": "1.5", "fontWeight": "500"}],
                    "caption": ["13px", {"lineHeight": "1.6", "fontWeight": "400"}],
                    "display-lg": ["48px", {"lineHeight": "1", "fontWeight": "700"}]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            vertical-align: middle;
        }
        .jelly-float {
            animation: float 4s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .jelly-inner-glow {
            box-shadow: inset 0 0 40px rgba(255, 255, 255, 0.6);
        }
        .bg-pastel-gradient {
            background: linear-gradient(135deg, #FAF8F5 0%, #ffd1dc44 50%, #dbdbef44 100%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-surface font-body-md overflow-x-hidden">
<!-- Top AppBar -->
<header class="fixed top-0 left-0 w-full h-16 z-50 flex justify-between items-center px-layout-margin bg-surface/85 dark:bg-surface-dim/85 backdrop-blur-[8px]">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-h1">bubble_chart</span>
<h1 class="font-h1 text-h1 text-primary tracking-tight">Mind Jelly</h1>
</div>
<button class="p-2 hover:opacity-80 transition-opacity active:scale-95">
<span class="material-symbols-outlined text-on-surface-variant">settings</span>
</button>
</header>
<main class="min-h-screen pt-24 pb-32 px-layout-margin bg-pastel-gradient">
<!-- Progress Indicator -->
<div class="flex justify-center gap-2 mb-10">
<div class="h-1.5 w-8 rounded-full bg-primary/20"></div>
<div class="h-1.5 w-12 rounded-full bg-primary"></div>
<div class="h-1.5 w-8 rounded-full bg-primary/20"></div>
</div>
<!-- Heading Section -->
<div class="text-center mb-12">
<h2 class="font-display text-display-lg text-on-surface mb-0">어떻게 하나요?</h2>
<p class="font-gowun text-body-md text-on-surface-variant">당신의 감정을 젤리에게 선물하세요.</p>
</div>
<!-- Visual Onboarding Steps -->
<div class="flex flex-col gap-10 items-center max-w-md mx-auto">
<!-- Step 1: Illustration Cluster -->
<div class="relative w-full aspect-square flex items-center justify-center">
<!-- Main Jelly Character -->
<div class="relative z-10 w-48 h-48 rounded-[45%_55%_50%_50%/50%_50%_50%_50%] bg-jelly-base jelly-float jelly-inner-glow flex items-center justify-center border-4 border-white/40 shadow-xl">
<div class="flex flex-col items-center gap-2">
<div class="flex gap-4">
<div class="w-2.5 h-2.5 rounded-full bg-on-primary-container/60"></div>
<div class="w-2.5 h-2.5 rounded-full bg-on-primary-container/60"></div>
</div>
<div class="w-6 h-2 border-b-2 border-on-primary-container/40 rounded-full"></div>
</div>
</div>
<!-- Floating Emotion Beads with Arrows -->
<!-- Joy Bead (Yellow Tone) -->
<div class="absolute top-0 right-4 flex flex-col items-center gap-2">
<div class="w-8 h-8 rounded-full bg-[#FFE5B4] shadow-lg border-2 border-white flex items-center justify-center">
<span class="material-symbols-outlined text-[#7A5761] text-[18px]">mood</span>
</div>
<span class="material-symbols-outlined text-primary opacity-40 rotate-[135deg]">arrow_downward</span>
</div>
<!-- Sad Bead (Blue Tone) -->
<div class="absolute left-4 bottom-10 flex flex-col items-center gap-2">
<span class="material-symbols-outlined text-primary opacity-40 rotate-[-45deg]">arrow_upward</span>
<div class="w-10 h-10 rounded-full bg-jelly-sad shadow-lg border-2 border-white flex items-center justify-center">
<span class="material-symbols-outlined text-white text-[22px]">water_drop</span>
</div>
</div>
<!-- Anger Bead (Red Tone) -->
<div class="absolute top-10 left-8 flex flex-col items-center gap-2">
<div class="w-6 h-6 rounded-full bg-jelly-anger shadow-lg border-2 border-white flex items-center justify-center">
<span class="material-symbols-outlined text-white text-[14px]">bolt</span>
</div>
<span class="material-symbols-outlined text-primary opacity-40 rotate-[160deg]">arrow_downward</span>
</div>
</div>
<!-- Step Details (Bento Grid Style) -->
<div class="grid grid-cols-1 md:grid-cols-3 gap-4 w-full">
<!-- Step 1 Card -->
<div class="glass-card p-6 rounded-lg text-center shadow-sm border border-white/20">
<div class="w-10 h-10 rounded-full bg-primary-container text-on-primary-container font-h1 flex items-center justify-center mx-auto mb-4">1</div>
<p class="font-gowun text-body-md text-on-surface">감정 구슬을<br/>선택하세요</p>
</div>
<!-- Step 2 Card -->
<div class="glass-card p-6 rounded-lg text-center shadow-sm border border-white/20">
<div class="w-10 h-10 rounded-full bg-primary-container text-on-primary-container font-h1 flex items-center justify-center mx-auto mb-4">2</div>
<p class="font-gowun text-body-md text-on-surface">젤리가 맛있게<br/>먹어줄 거예요</p>
</div>
<!-- Step 3 Card -->
<div class="glass-card p-6 rounded-lg text-center shadow-sm border border-white/20">
<div class="w-10 h-10 rounded-full bg-primary-container text-on-primary-container font-h1 flex items-center justify-center mx-auto mb-4">3</div>
<p class="font-gowun text-body-md text-on-surface">마음이 한결<br/>가벼워져요</p>
</div>
</div>
</div>
</main>
<!-- Bottom Button Navigation -->
<footer class="fixed bottom-0 left-0 w-full p-layout-margin bg-surface/85 backdrop-blur-[8px] z-50">
<div class="max-w-md mx-auto">
<button class="w-full h-14 bg-primary text-on-primary rounded-full font-h1 text-h1 hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2 font-gowun">
<span>다음</span>
<span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</footer>
<!-- Decorative Elements (Blobs) -->
<div class="fixed top-20 -left-20 w-64 h-64 bg-primary-container/20 rounded-full blur-[60px] -z-10"></div>
<div class="fixed bottom-20 -right-20 w-80 h-80 bg-tertiary-container/20 rounded-full blur-[80px] -z-10"></div>
</body></html>
