<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF0F5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFE0EB;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="jellyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD1DC;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFB6C8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF9EB5;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="shine" cx="40%" cy="35%" r="35%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#FFB6C8" flood-opacity="0.4"/>
    </filter>
    <filter id="innerShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur"/>
      <feOffset dx="0" dy="4" result="offsetBlur"/>
      <feComposite in="SourceGraphic" in2="offsetBlur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" rx="120" fill="url(#bgGrad)"/>

  <!-- Decorative circles -->
  <circle cx="120" cy="120" r="40" fill="#D1C4FF" opacity="0.3"/>
  <circle cx="480" cy="100" r="25" fill="#FF9ECD" opacity="0.25"/>
  <circle cx="520" cy="480" r="35" fill="#D1C4FF" opacity="0.2"/>
  <circle cx="80" cy="460" r="20" fill="#FFD1DC" opacity="0.3"/>

  <!-- Jelly body shadow -->
  <ellipse cx="300" cy="400" rx="140" ry="30" fill="#FFB6C8" opacity="0.2"/>

  <!-- Jelly body -->
  <g filter="url(#shadow)">
    <path d="
      M 210 340
      C 210 280, 200 240, 220 200
      C 240 160, 260 140, 300 135
      C 340 130, 370 150, 385 180
      C 400 210, 405 250, 400 300
      C 395 350, 390 380, 370 400
      C 350 420, 320 430, 300 430
      C 270 430, 240 420, 225 400
      C 210 380, 210 370, 210 340
      Z
    " fill="url(#jellyGrad)"/>

    <!-- Jelly wobble top -->
    <path d="
      M 240 180
      C 250 160, 270 140, 300 135
      C 330 130, 355 145, 370 165
      Q 355 155, 340 160
      Q 320 145, 300 148
      Q 275 150, 260 165
      Q 248 172, 240 180
      Z
    " fill="#FFDCE5" opacity="0.6"/>
  </g>

  <!-- Shine overlay -->
  <ellipse cx="270" cy="220" rx="60" ry="70" fill="url(#shine)" opacity="0.5"/>

  <!-- Left eye -->
  <g>
    <ellipse cx="268" cy="260" rx="18" ry="20" fill="#4A3347"/>
    <ellipse cx="273" cy="254" rx="7" ry="8" fill="#FFFFFF"/>
    <ellipse cx="263" cy="266" rx="4" ry="4" fill="#FFFFFF" opacity="0.5"/>
  </g>

  <!-- Right eye -->
  <g>
    <ellipse cx="332" cy="260" rx="18" ry="20" fill="#4A3347"/>
    <ellipse cx="337" cy="254" rx="7" ry="8" fill="#FFFFFF"/>
    <ellipse cx="327" cy="266" rx="4" ry="4" fill="#FFFFFF" opacity="0.5"/>
  </g>

  <!-- Blush -->
  <ellipse cx="245" cy="295" rx="18" ry="10" fill="#FF9ECD" opacity="0.35"/>
  <ellipse cx="355" cy="295" rx="18" ry="10" fill="#FF9ECD" opacity="0.35"/>

  <!-- Mouth (cute smile) -->
  <path d="M 288 310 Q 300 325 312 310" stroke="#7A5F7D" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Small decorative stars/sparkles -->
  <g fill="#FFD93D" opacity="0.6">
    <polygon points="420,180 423,190 433,190 425,196 428,206 420,200 412,206 415,196 407,190 417,190" transform="scale(0.7) translate(180,50)"/>
    <polygon points="180,220 183,228 191,228 185,233 187,241 180,236 173,241 175,233 169,228 177,228" transform="scale(0.6) translate(-50,20)"/>
  </g>

  <!-- Lavender accent blob -->
  <ellipse cx="380" cy="380" rx="15" ry="12" fill="#D1C4FF" opacity="0.4"/>
  <ellipse cx="230" cy="390" rx="10" ry="8" fill="#D1C4FF" opacity="0.3"/>
</svg>
